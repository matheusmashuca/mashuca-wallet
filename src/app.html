async function saveTx(tx,isNew,readInto,rp,getSv){
  readInto();const sv=getSv();
  if(hasSplits(tx)){tx.splits=tx.splits.filter(x=>x.amount>0);if(!tx.splits.length)delete tx.splits}
  if(hasSplits(tx)){const net=splitNet(tx.splits);const cur=getAcc(tx.accountId)?.currency;
    if(tx.splits.some(x=>!x.categoryId)){toast("Escolha a categoria de cada linha do detalhamento.");return}
    if(!tx.amount)tx.amount=Math.abs(net);
    if((tx.kind==="income"&&net<=0)||(tx.kind==="expense"&&net>=0)){toast(`O líquido das linhas é ${net>0?"uma entrada":"uma saída"} de ${money(Math.abs(net),cur)}; mude o tipo para ${net>0?"Receita":"Despesa"}.`);return}
    if(Math.abs(Math.abs(net)-Math.abs(tx.amount))>=0.005){toast(`As linhas somam ${money(Math.abs(net),cur)}, mas o valor líquido é ${money(Math.abs(tx.amount),cur)}. Ajuste antes de salvar.`);return}
    const big=tx.splits.filter(x=>x.type===tx.kind).sort((a,b)=>b.amount-a.amount)[0];tx.categoryId=big?big.categoryId:tx.splits[0].categoryId}
  if(!tx.amount){toast("Informe um valor maior que zero.");return}if(tx.reversal&&tx.amount>0)tx.amount=-tx.amount;
  const a=getAcc(tx.accountId);if(!a){toast("Escolha uma conta.");return}
  let to=null;
  if(tx.kind==="transfer"){
    to=getAcc(tx.toAccountId);if(!to||to.id===tx.accountId){toast("Escolha contas de origem e destino diferentes.");return}
    if(to.currency!==a.currency){if(!tx.amountTo){toast(`Informe o valor de destino em ${to.currency}.`);return}}else tx.amountTo=undefined;
    if(to.type!=="card")tx.invoice=undefined;else if(!tx.invoice)tx.invoice=invoiceFor(to,tx.date);
    if(!tx.description)tx.description=to.type==="card"?"Pagamento de fatura":"Transferência";tx.categoryId="";
  }
  if(a.type==="card"&&tx.kind!=="transfer"&&!tx.invoice)tx.invoice=invoiceFor(a,tx.date);
  applyStatus(tx,sv);if(a.type==="card"&&tx.kind!=="transfer"&&tx.status==="pending")tx.status="paid";
  const keys=[];const today=todayStr();
  if(isNew){
    tx.created=new Date().toISOString();
    if(rp.mode==="none"){keys.push(putTx(tx))}
    else{
      const ds=occurrences(tx.date,rp);const n=ds.length;const group=uid();
      const split=rp.mode==="inst"&&rp.basis!=="each";
      const base=split?Math.floor(tx.amount/n*100)/100:tx.amount;const first=split?r2(tx.amount-base*(n-1)):tx.amount;
      const baseTo=tx.amountTo!=null&&split?Math.floor(tx.amountTo/n*100)/100:tx.amountTo;
      const invTarget=a.type==="card"&&tx.kind!=="transfer"?a:(to&&to.type==="card"?to:null);
      const invOffset=invTarget&&tx.invoice?monthsDiff(invoiceFor(invTarget,tx.date),tx.invoice):0;
      ds.forEach((d,i)=>{
        const c={...tx,id:i===0?tx.id:uid(),group,date:d,amount:i===0?first:base};
        if(tx.amountTo!=null)c.amountTo=i===0&&split?r2(tx.amountTo-baseTo*(n-1)):baseTo;
        if(rp.mode==="inst")c.inst={n:i+1,total:n};else c.recur={every:rp.every,unit:rp.unit};
        if(invTarget)c.invoice=addMonths(invoiceFor(invTarget,d),invOffset);
        const isCardPurchase=a.type==="card"&&tx.kind!=="transfer";
        if(i>0&&!isCardPurchase&&d>today){c.status="pending";if(c.recon==="ok")c.recon=null}
        keys.push(putTx(c));
      });
    }
  } else {
    const scope=document.getElementById("tx-scope")?.value||"one";
    const old=findTx(tx.id);keys.push(...(old?[monthOf(old.date)]:[]));
    keys.push(putTx(tx,old?.date));
    if(scope==="next"&&tx.group){
      for(const o of allTx().filter(x=>x.group===tx.group&&x.id!==tx.id&&x.date>old.date)){
        const u={...o,description:tx.description,categoryId:tx.categoryId,payee:tx.payee,payeeId:tx.payeeId,costCenter:tx.costCenter,tags:tx.tags,accountId:tx.accountId,toAccountId:tx.toAccountId};
        if(o.recur){u.amount=tx.amount;if(tx.amountTo!=null)u.amountTo=tx.amountTo;if(hasSplits(tx))u.splits=tx.splits.map(x=>({...x}));else delete u.splits}keys.push(putTx(u,o.date));
      }
    }
  }
  closeModal();render();await flush(keys);toast(isNew?(rp.mode==="none"?"Lançamento salvo":"Lançamentos criados"):"Lançamento atualizado");
}

function closedUnpaidInvoices(){
  const out=[];const today=todayStr();
  for(const c of activeAccounts().filter(a=>a.type==="card")){const cur=currentInvoice(c);for(const k of [addMonths(cur,-1),cur]){const d=invoiceData(c,k);if(today>d.close&&d.total>0&&d.payments.length===0)out.push({c,k,d})}}
  return out;
}

const findTx=id=>allTx().find(x=>x.id===id);
function deleteTx(tx,scope){
  const old=findTx(tx.id);if(!old){closeModal();return}
  const victims=scope==="next"&&old.group?allTx().filter(x=>x.group===old.group&&x.date>=old.date):[old];
  confirmBox(victims.length>1?`Excluir ${victims.length} lançamentos?`:"Excluir este lançamento?",t("del"),async()=>{const keys=victims.map(removeTx);ui.sel.clear();render();await flush(keys);toast("Excluído")});
}

async function offerFile(filename,data,mime){
  if(!window.claude&&!isNative()){try{const url=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Arquivo baixado");return}catch(e){}}
  const dl=window.claude?.use?await window.claude.use("downloads"):null;
  if(dl){try{await dl.save({filename,data:new Blob([data],{type:mime})});toast("Arquivo pronto");return}catch(e){if(e&&e.code==="declined")return}}
  openModal(`<h3>Copie o conteúdo</h3><p class="muted">Não foi possível salvar o arquivo direto. Copie o texto e cole em um arquivo ${esc(filename)}.</p><textarea id="cp-txt" rows="10" style="width:100%;font-family:monospace;font-size:12px" readonly>${esc(data)}</textarea><div class="actions"><button class="btn" data-act="closeModal">Fechar</button><button class="btn primary" id="cp-btn">Copiar</button></div>`,m=>{m.querySelector("#cp-btn").onclick=()=>{const ta=m.querySelector("#cp-txt");navigator.clipboard?.writeText(data).then(()=>toast("Copiado")).catch(()=>{ta.select()})}});
}
function csv(list){
  const rows=[["data","tipo","conta","moeda","valor","categoria","descricao","favorecido","centro_custo","tags","situacao","fatura","conta_destino"]];
  (list||allTx()).slice().sort((a,b)=>a.date<b.date?-1:1).forEach(tx=>{const a=getAcc(tx.accountId);rows.push([tx.date,tx.kind,a?.name||"",a?.currency||"",String(tx.amount).replace(".",","),catName(tx.categoryId),tx.description,payeeName(tx),tx.costCenter,tx.tags,tx.status,tx.invoice||"",getAcc(tx.toAccountId)?.name||""])});
  return rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n");
}
async function replaceAll(cfg,months){

function ioKey(map,v){const n=norm(v);if(!n)return null;for(const [k,al] of Object.entries(map))if(norm(k)===n||al.some(a=>norm(a)===n))return k;return undefined}
const ioYes=v=>/^(s|sim|y|yes|oui|o|1|true|x|verdadeiro|vrai)$/i.test(String(v??"").trim());

const ioColorIn=(v,keep)=>{const n=parseInt(v,10);return n>=1&&n<=COLORS.length?COLORS[n-1]:keep};
function ioMonth(v){if(ioBlank(v))return null;if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${pad(v.getMonth()+1)}`;
  if(typeof v==="number"&&v>20000&&v<80000)return parseDateAny(v).slice(0,7);
  const s=String(v).trim();let m;if(/^(padr|default|defaut|todos|todo)/i.test(norm(s)))return "default";
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})/)))return `${m[1]}-${pad(m[2])}`;if((m=s.match(/^(\d{1,2})[-\/.](\d{4})$/)))return `${m[2]}-${pad(m[1])}`;
  if((m=s.match(/^\d{1,2}[-\/.](\d{1,2})[-\/.](\d{4})$/)))return `${m[2]}-${pad(m[1])}`;return undefined}

function ioCountry(cfg,v){if(ioBlank(v))return null;const s=String(v).trim();const up=s.toUpperCase();if(COUNTRIES.some(c=>c[0]===up))return up;const c=COUNTRIES.find(c=>norm(c[1])===norm(s));return c?c[0]:undefined}

function ioAcc(cfg,v,filter){if(ioBlank(v))return null;const n=norm(v);const L=cfg.accounts.filter(a=>!filter||filter(a));return L.find(a=>a.id===String(v).trim())||L.find(a=>norm(a.name)===n)}
function ioCatPath(cfg,c){if(!c)return "";if(c.parent){const p=cfg.categories.find(x=>x.id===c.parent);return (p?p.name+" › ":"")+c.name}return c.name}
function ioCatFind(cfg,v,type){if(ioBlank(v))return null;const s=String(v).trim();const byId=cfg.categories.find(c=>c.id===s);if(byId)return byId;
  const parts=s.split(/\s*(?:›|>|\/)\s*/).filter(Boolean);const types=type?[type]:["expense","income"];
  for(const tp of types){const top=cfg.categories.find(c=>!c.parent&&c.type===tp&&norm(c.name)===norm(parts[0]));
    if(top&&parts.length===1)return top;if(top){const sub=cfg.categories.find(c=>c.parent===top.id&&norm(c.name)===norm(parts[1]));if(sub)return sub}}
  if(parts.length===1)for(const tp of types){const sub=cfg.categories.filter(c=>c.parent&&c.type===tp&&norm(c.name)===norm(parts[0]));if(sub.length===1)return sub[0]}
  return undefined}

  imp+=`<p class="muted" style="font-size:13px">Linhas com erro são ignoradas; o resto é importado. Substituir nunca apaga contas, cartões, categorias ou cadastros que já têm lançamentos.</p>
   <div class="tools"><button class="btn" data-act="ioCancel">Cancelar</button><button class="btn primary" data-act="ioApply" ${tot?"":"disabled"}>Importar ${tot} alteração(ões)</button></div>`}
 imp+=`</section>`;
 return exp+imp}

document.addEventListener("change",async e=>{const el=e.target;const act=el.dataset?.act;if(!act||!act.startsWith("io"))return;
 if(act==="ioExp"){const s=ioExportSel();el.checked?s.add(el.dataset.k):s.delete(el.dataset.k);render()}
 else if(act==="ioFrom"){ui.ioFrom=el.value}else if(act==="ioTo"){ui.ioTo=el.value}
 else if(act==="ioFile"){const f=el.files[0];if(!f)return;try{ui.io=await ioReadFile(f);ioPreview();render()}catch(err){toast("Não foi possível ler o arquivo: "+(err.message||err))}}
 else if(act==="ioInc"&&ui.io){ui.io.sheets[+el.dataset.i].include=el.checked;ioPreview();render()}
 else if(act==="ioKind"&&ui.io){const s=ui.io.sheets[+el.dataset.i];s.key=el.value||null;s.include=!!s.key;s.mode="merge";ioPreview();render()}
 else if(act==="ioMode"&&ui.io){ui.io.sheets[+el.dataset.i].mode=el.value;ioPreview();render()}
});
document.addEventListener("click",async e=>{const el=e.target.closest("[data-act]");if(!el)return;const act=el.dataset.act;if(!act.startsWith("io")||el.tagName==="INPUT"||el.tagName==="SELECT")return;
 if(act==="ioXlsx")await ioExportXlsx(false);
 else if(act==="ioTemplate")await ioExportXlsx(true);
 else if(act==="ioCsv")await ioExportCsv();
 else if(act==="ioAll"){const s=ioExportSel();if(s.size===IO_DEFS.length)s.clear();else IO_DEFS.forEach(d=>s.add(d.key));render()}
 else if(act==="ioCancel"){ui.io=null;render()}
 else if(act==="ioApply"){const pv=ui.io?.preview;const del=pv?pv.results.reduce((s,r)=>s+r.del,0):0;
  if(del)confirmBox(`A importação vai remover ${del} item(ns) que não estão na planilha. Continuar?`,"Importar",ioCommit);else await ioCommit()}
});

boot();
</script>
