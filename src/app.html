<style>
/* Layout: app shell — sidebar on desktop, bottom tab bar on phone; ledger-style tables, conclusion-first headings */
:root{
  --bg:#ffffff; --surface:#f5f7f9; --line:#e2e7ec; --fg:#14212e; --muted:#5d6b78;
  --accent:#1f5f7a; --accent-soft:#e3eef3; --pos:#2f7d4f; --neg:#b0413e; --warn:#b07a1a;
  --c1:#1f5f7a; --c2:#7a9cb0; --c3:#9c8366; --c4:#5f7f6a; --c5:#8a6f8f; --c6:#b0896a; --c7:#6d7f91; --c8:#a3a37a;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#16202a; --line:#26323e; --fg:#e4eaf0; --muted:#94a3b1;
  --accent:#6fb3cf; --accent-soft:#1b3341; --pos:#6cc191; --neg:#e3807a; --warn:#e0b25a;
  --c1:#6fb3cf; --c2:#9fbccc; --c3:#c7a985; --c4:#8fb49a; --c5:#b99abe; --c6:#d6ae8d; --c7:#9cb0c2; --c8:#c6c69a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#16202a; --line:#26323e; --fg:#e4eaf0; --muted:#94a3b1;
  --accent:#6fb3cf; --accent-soft:#1b3341; --pos:#6cc191; --neg:#e3807a; --warn:#e0b25a;
  --c1:#6fb3cf; --c2:#9fbccc; --c3:#c7a985; --c4:#8fb49a; --c5:#b99abe; --c6:#d6ae8d; --c7:#9cb0c2; --c8:#c6c69a;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 8px 18px}
.brand small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:var(--r);cursor:pointer;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface);color:var(--fg)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
main{min-width:0;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0;text-wrap:balance;line-height:1.2}
.head p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--bg);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.danger{color:var(--neg)}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.monthnav{display:inline-flex;align-items:center;gap:4px}
.monthnav span{min-width:120px;text-align:center;font-weight:600;text-transform:capitalize}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r)}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .v{font-size:22px;font-weight:600;margin-top:2px}
.kpi .s{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
.panel{border-top:2px solid var(--fg);padding-top:10px;min-width:0}
.panel h2{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 .muted{font-weight:400;font-size:13px}
.bars{display:flex;flex-direction:column;gap:2px}
.bar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{position:relative;height:12px;background:var(--surface);border-radius:2px}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:2px}
.bar .budget{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
details.cat summary{list-style:none;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
details.cat .subs{padding:2px 0 8px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
details.cat .subs div{display:flex;justify-content:space-between;gap:8px;max-width:420px}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{min-width:0}
.row .main b{font-weight:600}
.row .main div{overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--surface);color:var(--muted);font-weight:600;white-space:nowrap}
.pill.ok{color:var(--pos)} .pill.bad{color:var(--neg)} .pill.warn{color:var(--warn)} .pill.info{color:var(--accent)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface)}
tr.pending td{color:var(--muted)}
tr.pending td .desc{font-style:italic}
tr.total td{font-weight:700;background:var(--surface)}
.desc small{display:block;color:var(--muted);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.invhead{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r)}
.invhead > div{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.invhead > div:first-child{border-left:0}
.meter{height:6px;background:var(--surface);border-radius:3px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.selbar{position:sticky;bottom:12px;background:var(--fg);color:var(--bg);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;z-index:5}
.selbar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);margin:0 0 6px;font-family:var(--serif);font-weight:600}
.banner{border:1px solid var(--line);border-left:3px solid var(--warn);padding:10px 14px;border-radius:var(--r);background:var(--surface);font-size:14px}
.banner.info{border-left-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:8px 10px;width:100%}
.field .hint{font-size:12px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{border:1px solid var(--line);border-radius:99px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--fg);font-weight:500;cursor:pointer}
.checks input{width:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--fg) 35%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;z-index:50;overflow-y:auto}
.modal{background:var(--bg);border-radius:10px;width:100%;max-width:620px;padding:20px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.modal h3{margin:0;font-family:var(--serif);font-weight:600;font-size:20px}
.modal .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.modal .actions .spacer{margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:var(--r);z-index:60;font-weight:500}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}
.tabbar{display:none}
.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--bg);border:0;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 4px 14px color-mix(in srgb,var(--fg) 25%,transparent);z-index:20}
.welcome{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.welcome h1{font-family:var(--serif);font-weight:600;font-size:32px;margin:0;line-height:1.15;text-wrap:balance}
.steps{display:flex;gap:8px;font-size:13px;color:var(--muted)}
.steps b{color:var(--fg)}
/* dashboard grid, status and sign colors */
.cardsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r)}
.cardsum section{padding:12px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px;font-size:13.5px;min-width:0}
.cardsum section:first-child{border-left:0}
tr.subrow td{font-size:13px;color:var(--muted)}
.sp-row{display:grid;grid-template-columns:124px 1fr 104px 34px;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.sp-row .sp-desc{grid-column:1/-2}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:2px}
@media (max-width:520px){.sp-row{grid-template-columns:112px 1fr 30px}.sp-row [data-sp="amt"]{grid-column:1/3}.sp-row [data-spdel]{grid-row:1;grid-column:3}.sp-row .sp-desc{grid-column:1/-1}}
tr.daysum td{font-size:12px;color:var(--muted);background:var(--surface);padding-block:4px}
.accpick{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.accpick-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.accpick .chip{background:var(--bg)}
.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 20px}
.dash > section{min-width:0}.dash > .wide,.dash > section:not(.panel){grid-column:1/-1}
.pos{color:var(--u-pos,var(--pos))} .neg{color:var(--u-neg,var(--neg))}
body.nosign .pos,body.nosign .neg{color:inherit}
.st-paid{--stc:var(--u-st-paid,var(--muted))}.st-sched{--stc:var(--u-st-sched,var(--warn))}.st-late{--stc:var(--u-st-late,var(--neg))}.st-pending{--stc:var(--u-st-pending,var(--warn))}.st-rec{--stc:var(--u-st-rec,var(--accent))}.st-auto{--stc:var(--u-st-auto,var(--c5))}
tr.st-row td:first-child{box-shadow:inset 3px 0 0 var(--stc)}
div.row.st-row{box-shadow:inset 3px 0 0 var(--stc);padding-left:12px}
.pill.st-sched,.pill.st-late,.pill.st-paid,.pill.st-pending,.pill.st-rec,.pill.st-auto{color:var(--stc);background:color-mix(in srgb,var(--stc) 12%,transparent)}
body.nostatus tr.st-row td:first-child,body.nostatus div.row.st-row{box-shadow:none}
body.nostatus .pill.st-sched,body.nostatus .pill.st-late,body.nostatus .pill.st-paid,body.nostatus .pill.st-pending,body.nostatus .pill.st-rec,body.nostatus .pill.st-auto{color:var(--muted);background:var(--surface)}
details.cat[data-nosub] summary{cursor:default}
@media (max-width:860px){
  .dash{grid-template-columns:1fr}
  .app{grid-template-columns:1fr}
  .side{display:none}
  .grid2{grid-template-columns:1fr}
  .kpis,.invhead{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cardsum{grid-template-columns:repeat(2,minmax(0,1fr))}.cardsum section:nth-child(3){border-left:0}.cardsum section:nth-child(n+3){border-top:1px solid var(--line)}
  .kpis.k5 .kpi:nth-child(odd){border-left:0}.kpis.k5 .kpi:nth-child(3){border-left:0}.kpis.k5 .kpi:nth-child(5){grid-column:1/-1}
  .kpi:nth-child(3),.invhead>div:nth-child(3){border-left:0}
  .kpi:nth-child(n+3),.invhead>div:nth-child(n+3){border-top:1px solid var(--line)}
  main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:30}
  .tabbar button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
  .tabbar button[aria-current="true"]{color:var(--accent)}
  .tabbar svg{width:20px;height:20px}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .bar{grid-template-columns:minmax(0,110px) minmax(0,1fr) auto}
  .form{grid-template-columns:1fr}
  .head h1{font-size:22px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* cards & invoices: invoice key = month in which the statement closes */
function invoiceFor(card,date){const k=monthOf(date);const day=Number(date.slice(8,10));const cd=Math.min(card.closingDay,daysIn(k));return day>cd?addMonths(k,1):k}
const closeDate=(card,key)=>dayDate(key,card.closingDay);
const dueDate=(card,key)=>card.dueDay>card.closingDay?dayDate(key,card.dueDay):dayDate(addMonths(key,1),card.dueDay);
const currentInvoice=card=>card?invoiceFor(card,todayStr()):null;
function invoiceData(card,key){
  let total=0,paid=0,sched=0;const items=[],payments=[];
  for(const tx of allTx()){
    if(tx.accountId===card.id&&tx.invoice===key&&tx.kind!=="transfer"){items.push(tx);total+=tx.kind==="expense"?tx.amount:-tx.amount}
    if(tx.kind==="transfer"&&tx.toAccountId===card.id&&tx.invoice===key){payments.push(tx);if(tx.status==="pending")sched+=tx.amountTo??tx.amount;else paid+=tx.amountTo??tx.amount}
  }
  total=r2(total);paid=r2(paid);sched=r2(sched);
  const today=todayStr();let st="open";
  if(total>0&&paid>=total-0.005)st="paid";else if(today>dueDate(card,key))st=total>0?"overdue":"paid";else if(today>closeDate(card,key)||payments.some(p=>p.closesInvoice)||closedFlag(card,key))st="closed";
  items.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return {total,paid,sched,items,payments,status:st,close:closeDate(card,key),due:dueDate(card,key),start:addDay(closeDate(card,addMonths(key,-1)),1)};
}
const addDay=(d,n)=>{const x=new Date(d+"T12:00");x.setDate(x.getDate()+n);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`};
const cashDate=tx=>{const a=getAcc(tx.accountId);return a&&a.type==="card"&&tx.invoice?dueDate(a,tx.invoice):tx.date};

/* balance of an account through a date */
function balance(acc,upto,inclPending){
  let b=acc.initialBalance||0;
  for(const tx of allTx()){
    if(upto&&tx.date>upto)continue;
    const isCard=acc.type==="card";
    if(!isCard&&!inclPending&&tx.status==="pending")continue;
    if(tx.accountId===acc.id){if(tx.kind==="expense")b-=tx.amount;else if(tx.kind==="income")b+=tx.amount;else if(tx.kind==="transfer")b-=tx.amount}
    if(tx.kind==="transfer"&&tx.toAccountId===acc.id)b+=(tx.amountTo??tx.amount);
  }
  return r2(b);
}
/* period aggregation */
function periodTx(key,regime,inclPending){
  return allTx().filter(tx=>{
    if(tx.kind==="transfer")return false;
    const a=getAcc(tx.accountId);if(!a)return false;
    const isCard=a.type==="card";
    if(!inclPending&&!isCard&&tx.status==="pending")return false;
    const d=regime==="caixa"?cashDate(tx):tx.date;
    return monthOf(d)===key;
  });
}
/* lançamento detalhado: tx.splits=[{id,type:"income"|"expense",categoryId,description,amount>=0}] */
const hasSplits=tx=>!!tx&&tx.kind!=="transfer"&&Array.isArray(tx.splits)&&tx.splits.length>0;
const splitNet=L=>r2((L||[]).reduce((s,x)=>s+(x.type==="income"?1:-1)*(+x.amount||0),0));
function txParts(tx){
  if(!hasSplits(tx))return [{kind:tx.kind,amount:tx.amount,categoryId:tx.categoryId}];
  const sg=tx.amount<0?-1:1;const parts=tx.splits.map(x=>({kind:x.type,amount:sg*(+x.amount||0),categoryId:x.categoryId}));
  const diff=r2((tx.kind==="income"?1:-1)*tx.amount-sg*splitNet(tx.splits));
  if(Math.abs(diff)>=0.005)parts.push({kind:diff>0?"income":"expense",amount:Math.abs(diff),categoryId:tx.categoryId});
  return parts;
}
const txCatLabel=tx=>hasSplits(tx)?`Detalhado · ${tx.splits.length} linhas`:catName(tx.categoryId);
const txSearchText=tx=>[tx.description,payeeName(tx),catName(tx.categoryId),tx.tags,...(hasSplits(tx)?tx.splits.flatMap(x=>[x.description,catName(x.categoryId)]):[])].join(" ");
const catInUse=id=>allTx().some(x=>[x.categoryId,...(x.splits||[]).map(y=>y.categoryId)].some(c=>c===id||getCat(c)?.parent===id));
function totals(key,regime,inclPending){
  let inc=0,exp=0;const byCat={};
  for(const tx of periodTx(key,regime,inclPending)){
    const a=getAcc(tx.accountId);
    for(const p of txParts(tx)){
      const v=conv(p.amount,a.currency);
      const isCardCredit=a.type==="card"&&p.kind==="income";
      if(p.kind==="expense"||isCardCredit){
        const sign=isCardCredit?-1:1;exp+=sign*v;
        const tc=topCat(p.categoryId);const tid=tc?tc.id:"_none";
        const o=byCat[tid]=byCat[tid]||{total:0,subs:{}};o.total+=sign*v;
        const sid=p.categoryId||"_none";o.subs[sid]=(o.subs[sid]||0)+sign*v;
      } else inc+=v;
    }
  }
  return {inc:r2(inc),exp:r2(exp),byCat};
}

    ${arr.map(tx=>{const a=getAcc(tx.accountId);return `<tr class="click st-row st-${txState(tx)}" data-act="edittx" data-id="${tx.id}"><td data-stop="1"><input type="checkbox" data-act="sel" data-id="${tx.id}" ${ui.sel.has(tx.id)?"checked":""} aria-label="Selecionar"></td><td class="num">${fmtDate(tx.date)}</td><td class="desc">${esc(tx.description||catName(tx.categoryId))}${txTags(tx)}<small>${esc(a.name)} · ${esc(catName(tx.categoryId))}${tx.recur?" · recorrente":""}${tx.inst?` · ${tx.inst.n}/${tx.inst.total}`:""}</small></td>
    <td class="r num ${tx.kind==="income"?"pos":"neg"}">${money(tx.kind==="income"?tx.amount:-tx.amount,a.currency)}</td><td class="r" data-stop="1"><button class="btn small" data-act="markPaid" data-id="${tx.id}">${tx.kind==="income"?"Receber":"Pagar"}</button></td></tr>`}).join("")}

/* ===================== reports ===================== */
function viewReports(){
  const months=[];for(let i=11;i>=0;i--)months.push(addMonths(ui.month,-i));
  const data=months.map(m=>({m,...totals(m,ui.regime,ui.inclPending)}));
  const W=720,H=240,P={l:56,r:10,t:12,b:26};
  const mx=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const step=niceStep(mx);const top=Math.ceil(mx/step)*step;
  const y=v=>P.t+(H-P.t-P.b)*(1-v/top);
  const bw=(W-P.l-P.r)/12;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("cashflow")}">`;
  for(let v=0;v<=top+0.001;v+=step){svg+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end">${compact(v)}</text>`}
  data.forEach((d,i)=>{const x=P.l+i*bw;const w=bw*0.34;
    svg+=`<rect x="${x+bw*0.14}" y="${y(d.inc)}" width="${w}" height="${y(0)-y(d.inc)}" fill="var(--pos)" opacity=".8"><title>${monthLabel(d.m)} · ${t("income")} ${money(d.inc)}</title></rect>`;
    svg+=`<rect x="${x+bw*0.14+w+2}" y="${y(d.exp)}" width="${w}" height="${y(0)-y(d.exp)}" fill="var(--neg)" opacity=".8"><title>${monthLabel(d.m)} · ${t("expense")} ${money(d.exp)}</title></rect>`;
    svg+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" ${d.m===ui.month?'style="fill:var(--fg);font-weight:700"':""}>${monthShort(d.m)}</text>`});
  svg+="</svg>";
  const sumInc=r2(data.reduce((s,d)=>s+d.inc,0)),sumExp=r2(data.reduce((s,d)=>s+d.exp,0));
  const six=months.slice(-6);const sixData=six.map(m=>totals(m,ui.regime,ui.inclPending));
  const catIds=[...new Set(sixData.flatMap(d=>Object.keys(d.byCat)))].sort((a,b)=>(sixData.reduce((s,d)=>s+(d.byCat[b]?.total||0),0))-(sixData.reduce((s,d)=>s+(d.byCat[a]?.total||0),0)));
  return `<div class="head"><div><div class="eyebrow">${t("reports")} · ${ui.regime==="caixa"?t("cash"):t("accrual")}</div><h1>${sumInc>=sumExp?`Em 12 meses, sobra acumulada de ${money(sumInc-sumExp)}`:`Em 12 meses, déficit acumulado de ${money(sumExp-sumInc)}`}</h1><p>${t("income")} ${money(sumInc)} · ${t("expense")} ${money(sumExp)} · média mensal de despesas ${money(sumExp/12)}</p></div>
   <div class="tools">${monthNav()}${seg("regime",[["competencia",t("accrual")],["caixa",t("cash")]],ui.regime)}</div></div>
   <section class="panel"><h2>${t("cashflow")}<span class="legend"><span><i style="background:var(--pos)"></i>${t("income")}</span><span><i style="background:var(--neg)"></i>${t("expense")}</span></span></h2><div class="chart" style="overflow-x:auto"><div style="min-width:520px">${svg}</div></div></section>
   <section class="panel"><h2>${t("catByMonth")}</h2>${catIds.length?`<div class="tablewrap"><table><thead><tr><th>${t("category")}</th>${six.map(m=>`<th class="r">${monthShort(m)}</th>`).join("")}<th class="r">Média</th></tr></thead><tbody>
    ${catIds.map(id=>{const vals=sixData.map(d=>d.byCat[id]?.total||0);return `<tr><td>${esc(catLabel(id))}</td>${vals.map(v=>`<td class="r num">${v?money(v):'<span class="muted">—</span>'}</td>`).join("")}<td class="r num">${money(vals.reduce((a,b)=>a+b,0)/6)}</td></tr>`}).join("")}
    <tr class="total"><td>${t("total")}</td>${sixData.map(d=>`<td class="r num">${money(d.exp)}</td>`).join("")}<td class="r num">${money(sixData.reduce((s,d)=>s+d.exp,0)/6)}</td></tr></tbody></table></div>`:`<p class="muted">${t("noData")}</p>`}</section>
   <div class="tools"><button class="btn" data-act="exportCsv">Exportar lançamentos (CSV)</button></div>`;
}
function niceStep(mx){const raw=mx/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function compact(v){try{return new Intl.NumberFormat(LOCALE[LANG],{notation:"compact",maximumFractionDigits:1}).format(v)}catch(e){return Math.round(v)}}

/* ===================== budget ===================== */
function viewBudget(){const d=dashCfg();const keep=d.currency;d.currency=mainCur();try{return viewBudgetMain()}finally{d.currency=keep}}
/* ===================== budget module ===================== */
const bPlan=()=>state.cfg.budgetPlan||(state.cfg.budgetPlan={});
const iPlan=()=>state.cfg.investPlan||(state.cfg.investPlan={});
function budgetFor(catId,m){const p=state.cfg.budgetPlan&&state.cfg.budgetPlan[m];if(p&&Object.prototype.hasOwnProperty.call(p,catId))return p[catId]||0;return (state.cfg.budgets||{})[catId]||0}
const subsOf=id=>state.cfg.categories.filter(c=>c.parent===id);
function catBudget(c,m){const own=budgetFor(c.id,m);if(own)return own;return r2(subsOf(c.id).reduce((s,x)=>s+budgetFor(x.id,m),0))}
function investFor(accId,m){const p=state.cfg.investPlan&&state.cfg.investPlan[m];if(p&&Object.prototype.hasOwnProperty.call(p,accId))return p[accId]||0;return (state.cfg.investDefault||{})[accId]||0}
const isInv=a=>a&&a.type==="investment";
function investActual(accId,m,proj){
  let v=0;for(const tx of allTx()){if(tx.kind!=="transfer"||monthOf(tx.date)!==m)continue;if(!proj&&tx.status==="pending")continue;
    const from=getAcc(tx.accountId),to=getAcc(tx.toAccountId);
    if(tx.toAccountId===accId&&!isInv(from))v+=tx.amountTo??tx.amount;
    if(tx.accountId===accId&&to&&!isInv(to))v-=tx.amount}
  return r2(v);
}
function budColor(pct,kind){if(kind==="expense")return pct>=100?"var(--neg)":pct>=70?"var(--warn)":"var(--pos)";return pct>=100?"var(--pos)":pct>30?"var(--warn)":"var(--neg)"}
function budActuals(kind,m,proj){
  if(kind==="expense"){const T=totals(m,ui.regime,proj);const out={};for(const id in T.byCat){out[id]={total:T.byCat[id].total,subs:T.byCat[id].subs}}return out}
  const I=incomeByCat(m,ui.regime,proj);return I.by;
}
function budgetTable(kind){
  const m=ui.month,proj=ui.budVis!=="conf";const act=budActuals(kind,m,proj);
  const tops=state.cfg.categories.filter(c=>c.type===kind&&!c.parent);
  const rows=tops.map(c=>{const b=catBudget(c,m);const a=r2(act[c.id]?.total||0);return {c,b,a}}).filter(r=>r.b||r.a);
  const totB=r2(rows.reduce((s,r)=>s+r.b,0)),totA=r2(rows.filter(r=>r.b).reduce((s,r)=>s+r.a,0));
  const open=ui.budOpen||(ui.budOpen=new Set());
  const line=(label,b,a,lvl,id,hasSubs,color)=>{const pct=b?a/b*100:0;const left=r2(Math.max(0,b-a)),over=r2(Math.max(0,a-b));
    return `<tr${lvl?' class="subrow"':""}><td style="${lvl?"padding-left:34px":""}">${hasSubs?`<button class="btn small" data-act="budToggle" data-id="${id}" aria-label="Subcategorias" style="padding:0 6px;margin-right:6px">${open.has(id)?"−":"+"}</button>`:lvl?"":'<span style="display:inline-block;width:30px"></span>'}${color?`<span class="dot" style="background:${color}"></span>`:""}${esc(label)}</td>
     <td class="r num">${b?money(b):'<span class="muted">—</span>'}</td><td class="r num">${money(a)}</td>
     <td class="r num hide-sm">${b?money(kind==="expense"?left:Math.max(0,b-a)):""}</td><td class="r num hide-sm ${kind==="expense"&&over?"neg":kind==="income"&&a>b&&b?"pos":""}">${b&&(a>b)?money(a-b):""}</td>
     <td style="min-width:120px">${b?`<div class="meter" style="margin:0"><i style="width:${Math.min(100,pct)}%;background:${budColor(pct,kind)}"></i></div><span class="muted" style="font-size:12px">${Math.round(pct)}%</span>`:""}</td></tr>`};
  const body=rows.map(r=>{const subs=subsOf(r.c.id);const hasSubs=subs.length>0;
    let h=line(r.c.name,r.b,r.a,0,r.c.id,hasSubs,r.c.color);
    if(hasSubs&&open.has(r.c.id))h+=subs.map(s=>line(s.name,budgetFor(s.id,m),r2(act[r.c.id]?.subs?.[s.id]||0),1,s.id,false,"")).join("")+(act[r.c.id]?.subs?.[r.c.id]?line("(sem subcategoria)",0,r2(act[r.c.id].subs[r.c.id]),1,"x",false,""):"");
    return h}).join("");
  const word=kind==="expense"?"gastos":"recebidos";
  const over=rows.filter(r=>r.b&&(kind==="expense"?r.a>r.b:r.a<r.b));
  return {html:rows.length?`<div class="tablewrap"><table><thead><tr><th>${t("category")}</th><th class="r">Meta</th><th class="r">Realizado</th><th class="r hide-sm">A realizar</th><th class="r hide-sm">Excedente</th><th>Uso</th></tr></thead><tbody>${body}
    <tr class="total"><td>${t("total")} com meta</td><td class="r num">${money(totB)}</td><td class="r num">${money(totA)}</td><td class="r num hide-sm">${money(Math.max(0,totB-totA))}</td><td class="r num hide-sm">${totA>totB?money(totA-totB):""}</td><td></td></tr></tbody></table></div>`
    :`<div class="empty"><h3>Sem metas em ${monthLabel(m)}</h3>Defina quanto pretende ${kind==="expense"?"gastar":"receber"} por categoria.<div style="margin-top:12px"><button class="btn primary" data-act="budDefine" data-kind="${kind}">Definir metas</button></div></div>`,
    head:totB?`${money(totA)} ${word} de ${money(totB)} ${kind==="expense"?"orçados":"previstos"}`:`Defina metas de ${kind==="expense"?"despesas":"receitas"} para ${monthLabel(m)}`,
    sub:over.length?(kind==="expense"?`${over.length} categoria(s) acima da meta: `:`${over.length} categoria(s) abaixo da meta: `)+over.map(r=>esc(r.c.name)).join(", "):totB?"Todas as categorias dentro da meta":""};
}
function investTable(){
  const m=ui.month,proj=ui.budVis!=="conf";const accs=activeAccounts().filter(isInv);
  const total=iPlan()[m]?.__total??(state.cfg.investDefault||{}).__total??0;
  const rows=accs.map(a=>{const b=investFor(a.id,m),v=investActual(a.id,m,proj);return {a,b,v}});
  const sumMain=r2(rows.reduce((s,r)=>s+conv(r.v,r.a.currency),0));
  const line=(label,b,v,cur,color)=>{const pct=b?v/b*100:0;return `<tr><td>${color?`<span class="dot" style="background:${color}"></span>`:""}${label}</td><td class="r num">${b?money(b,cur):'<span class="muted">—</span>'}</td><td class="r num ${v<0?"neg":""}">${money(v,cur)}</td><td class="r num hide-sm">${b?money(Math.max(0,b-v),cur):""}</td><td style="min-width:120px">${b?`<div class="meter" style="margin:0"><i style="width:${Math.max(0,Math.min(100,pct))}%;background:${budColor(pct,"income")}"></i></div><span class="muted" style="font-size:12px">${Math.round(pct)}%</span>`:""}</td></tr>`};
  return {html:accs.length?`<div class="tablewrap"><table><thead><tr><th>Conta de investimento</th><th class="r">Meta de aporte</th><th class="r">Aportado no mês</th><th class="r hide-sm">A aportar</th><th>Uso</th></tr></thead><tbody>
     ${rows.map(r=>line(esc(r.a.name)+` <span class="muted" style="font-size:12px">${r.a.currency}</span>`,r.b,r.v,r.a.currency,r.a.color)).join("")}
     <tr class="total"><td>Meta total do mês (${mainCur()})</td><td class="r num">${total?money(total):"—"}</td><td class="r num">${money(sumMain)}</td><td class="r num hide-sm">${total?money(Math.max(0,total-sumMain)):""}</td><td>${total?`<div class="meter" style="margin:0"><i style="width:${Math.max(0,Math.min(100,sumMain/total*100))}%;background:${budColor(sumMain/total*100,"income")}"></i></div>`:""}</td></tr></tbody></table></div>
     <p class="muted" style="font-size:13px">Conta como aporte o dinheiro novo que entra numa conta de investimento vindo de conta corrente, dinheiro ou cartão; resgates para essas contas reduzem o realizado. Rendimentos e transferências entre investimentos não contam.</p>`
    :`<div class="empty"><h3>Nenhuma conta de investimento</h3>Cadastre contas do tipo Investimento para acompanhar os aportes.</div>`,
   head:total?`${money(sumMain)} aportados de ${money(total)} previstos`:"Defina quanto aportar por mês em cada investimento"};
}
function budgetEvolution(kind){
  const ms=[];for(let i=5;i>=0;i--)ms.push(addMonths(ui.month,-i));const proj=ui.budVis!=="conf";
  const acts=ms.map(m=>budActuals(kind,m,proj));

  return `<div class="tablewrap"><table><thead><tr><th>${t("category")}</th>${ms.map(m=>`<th class="r">${monthShort(m)}</th>`).join("")}<th class="r">Média</th></tr></thead><tbody>
   ${tops.map(c=>{const cells=ms.map((m,i)=>{const b=catBudget(c,m),a=r2(acts[i][c.id]?.total||0);const pct=b?a/b*100:null;return {b,a,pct}});
     return `<tr><td><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</td>${cells.map(x=>`<td class="r num" style="${x.pct!=null?`box-shadow:inset 0 -3px 0 ${budColor(x.pct,kind)}`:""}">${money(x.a)}${x.b?`<div class="muted" style="font-size:11px">meta ${compact(x.b)}</div>`:""}</td>`).join("")}<td class="r num">${money(cells.reduce((s,x)=>s+x.a,0)/6)}</td></tr>`}).join("")}
   </tbody></table></div><p class="muted" style="font-size:13px">A faixa sob cada valor mostra a situação contra a meta do mês.</p>`;

function viewBudgetMain(){
  const tab=ui.budTab||"exp";
  const tabs=[["exp","Despesas"],["inc","Receitas"],["inv","Investimentos"],["evo","Evolução"],["goals","Metas de economia"]];
  const tabBar=`<div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-act="budTab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join("")}</div>`;
  if(tab==="goals"){const L=goals().filter(g=>!g.archived);const tot=L.reduce((s,g)=>s+goalStats(g).pmt,0);return `<div class="head"><div><div class="eyebrow">Metas de economia</div><h1>${L.length?`Guardar ${money(tot)} por mês cobre ${L.length} meta(s)`:"Planeje objetivos de médio e longo prazo"}</h1><p>Aplicação mensal ideal calculada pelo prazo e pelo rendimento informado.</p></div></div>${tabBar}${viewGoals()}`}
  const tools=`<div class="tools">${monthNav()}${seg("regime",[["competencia",t("accrual")],["caixa",t("cash")]],ui.regime)}${seg("budVis",[["proj","Projetada"],["conf","Confirmada"]],ui.budVis==="conf"?"conf":"proj")}${tab==="evo"?seg("budEvoKind",[["expense","Despesas"],["income","Receitas"]],ui.budEvoKind||"expense"):`<button class="btn primary" data-act="budDefine" data-kind="${tab==="exp"?"expense":tab==="inc"?"income":"invest"}">Definir metas</button>`}</div>`;

function applyPlan(plan,defKey,vals,mm){

function toMain(v,cur){const m=mainCur();if(cur===m)return v;const a=perEUR(cur),b=perEUR(m);if(a&&b)return v/a*b;const r=state.cfg?.rates?.[cur];return r?v*r:null}

function convTo(v,from,to){if(!from||from===to)return v;const x=toMain(v,from);if(x==null)return 0;const y=fromMain(x,to);return y==null?0:y}

/* ===================== chart helpers ===================== */
function yScale(min,max){if(min===max){max=min+1}const step=niceStep(Math.max(Math.abs(max-min),1e-9)*1);const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;return {lo,hi,step}}
function lineChart({series,labels,W=720,H=230,markX=-1,fmt=compact}){
  const P={l:58,r:14,t:14,b:26};const all=series.flatMap(s=>s.pts.filter(v=>v!=null));
  const sc=yScale(Math.min(0,...all),Math.max(0,...all));const n=labels.length;
  const x=i=>P.l+(W-P.l-P.r)*(n<=1?0:i/(n-1));const y=v=>P.t+(H-P.t-P.b)*(1-(v-sc.lo)/(sc.hi-sc.lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let v=sc.lo;v<=sc.hi+sc.step/1e6;v+=sc.step)s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${Math.abs(v)<1e-9?'stroke-width="1.5" stroke="var(--muted)"':""}/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  const every=Math.ceil(n/10);labels.forEach((l,i)=>{if(i%every===0||i===n-1)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`});
  if(markX>=0)s+=`<line x1="${x(markX)}" x2="${x(markX)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${x(markX)}" y="${P.t+8}" text-anchor="middle" style="fill:var(--fg);font-weight:600">hoje</text>`;
  for(const se of series){
    const pts=se.pts.map((v,i)=>v==null?null:[x(i),y(v)]);let d="";let pen=false;
    pts.forEach(p=>{if(!p){pen=false;return}d+=(pen?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);pen=true});
    if(se.area){const f=pts.filter(Boolean);s+=`<path d="M${f[0][0]} ${y(Math.max(sc.lo,0))} ${f.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")} L${f[f.length-1][0]} ${y(Math.max(sc.lo,0))}Z" fill="${se.color}" opacity=".08"/>`}
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" ${se.dash?'stroke-dasharray="5 4"':""} stroke-linejoin="round"/>`;
    const li=se.pts.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop();if(li!=null&&li>=0)s+=`<circle cx="${x(li)}" cy="${y(se.pts[li])}" r="3.5" fill="${se.color}"><title>${esc(se.label)}: ${money(se.pts[li])}</title></circle>`;

function columnChart({groups,labels,colors,W=720,H=220,avg=null,highlight=-1}){

  const n=labels.length;const bw=(W-P.l-P.r)/n;const k=groups.length;const y=v=>P.t+(H-P.t-P.b)*(1-(v-sc.lo)/(sc.hi-sc.lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let v=sc.lo;v<=sc.hi+sc.step/1e6;v+=sc.step)s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end">${compact(v)}</text>`;
  const every=Math.ceil(n/12);
  for(let i=0;i<n;i++){const gw=bw*0.72/k;for(let g=0;g<k;g++){const v=groups[g][i]||0;const x0=P.l+i*bw+bw*0.14+g*gw;s+=`<rect x="${x0}" y="${Math.min(y(v),y(0))}" width="${Math.max(1,gw-1.5)}" height="${Math.abs(y(0)-y(v))}" fill="${colors[g]}" rx="1.5"><title>${labels[i]}: ${money(v)}</title></rect>`}
    if(i%every===0||i===n-1)s+=`<text x="${P.l+i*bw+bw/2}" y="${H-8}" text-anchor="middle" ${i===highlight?'style="fill:var(--fg);font-weight:700"':""}>${labels[i]}</text>`}
  if(avg!=null&&avg>0)s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--fg)" stroke-dasharray="4 3"/><text x="${W-P.r}" y="${y(avg)-4}" text-anchor="end" style="fill:var(--fg)">média ${compact(avg)}</text>`;

}

/* ---------- parsing ---------- */
function parseDateAny(v){
  if(v==null||v==="")return null;
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})/)))return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))){let y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${pad(m[2])}-${pad(m[1])}`}
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})$/))){const y=todayStr().slice(0,4);return `${y}-${pad(m[2])}-${pad(m[1])}`}
  return null;
}
function parseAmountAny(v){
  if(typeof v==="number")return v;
  let s=String(v||"").trim();if(!s)return null;
  let neg=/^\(.*\)$/.test(s)||/^-|-\s*$|\bD$/i.test(s)||/^−/.test(s);
  s=s.replace(/[^\d,.\-]/g,"").replace(/-/g,"");if(!/\d/.test(s))return null;
  const n=parseNum(s);return neg?-n:n;
}
function parseOFX(text){
  const rows=[];const blocks=text.split(/<STMTTRN>/i).slice(1);
  const tag=(b,t)=>{const m=b.match(new RegExp("<"+t+">([^<\\r\\n]*)","i"));return m?m[1].trim():""};
  for(const b of blocks){const body=b.split(/<\/STMTTRN>/i)[0];
    const amt=parseNum(tag(body,"TRNAMT").replace(",","."));const date=parseDateAny(tag(body,"DTPOSTED"));
    const name=tag(body,"NAME"),memo=tag(body,"MEMO");
    if(date&&!isNaN(amt))rows.push({date,amount:amt,desc:[name,memo&&memo!==name?memo:""].filter(Boolean).join(" · ")||"Lançamento",fitid:tag(body,"FITID")?"ofx:"+tag(body,"FITID"):null,source:"OFX"});
  }
  const cur=(text.match(/<CURDEF>([A-Z]{3})/i)||[])[1];
  return {rows,currency:cur};
}
function parseCSVText(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/).slice(0,5).join("\n");
  const delim=[";","\t",",","|"].map(d=>[d,(first.match(new RegExp(d==="|"?"\\|":d,"g"))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const out=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===delim){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);cell="";if(row.some(x=>x.trim()!==""))out.push(row);row=[]}
    else cell+=c}
  row.push(cell);if(row.some(x=>x.trim()!==""))out.push(row);
  return out;
}
function guessMapping(table){

  const head=table[h].map(norm);const find=re=>head.findIndex(c=>re.test(c));
  return {header:h,date:find(/^(data|date|dt)|data |date |fecha/),amount:find(/valor|amount|montant|value|importe|somme/),
    debit:find(/debit|saida|withdraw|sortie/),credit:find(/credit|entrada|deposit|entree/),

function tableToRows(table,map){

const CUR_SYM={"R$":"BRL","BRL":"BRL","€":"EUR","EUR":"EUR","US$":"USD","USD":"USD","$":"USD","£":"GBP","GBP":"GBP","CHF":"CHF"};
function parseNotification(raw){
  const text=raw.replace(/\s+/g," ").trim();if(!text)return null;
  const srcM=text.match(/^([^:]{2,32}):\s/);const source=srcM?srcM[1].trim():text.split(" ")[0];
  const body=srcM?text.slice(srcM[0].length):text;
  let m=body.match(/(R\$|US\$|€|EUR|BRL|USD|GBP|£|CHF|\$)\s?(-?\d{1,3}(?:[.\s]\d{3})*(?:[.,]\d{1,2})?|-?\d+(?:[.,]\d{1,2})?)/i);
  let cur,amtStr;
  if(m){cur=CUR_SYM[m[1].toUpperCase()]||CUR_SYM[m[1]];amtStr=m[2]}
  else{m=body.match(/(-?\d{1,3}(?:[.\s]\d{3})*(?:[.,]\d{1,2})|-?\d+(?:[.,]\d{1,2})?)\s?(€|EUR|R\$|BRL|USD|CHF|GBP)/i);if(m){cur=CUR_SYM[m[2].toUpperCase()]||CUR_SYM[m[2]];amtStr=m[1]}}
  if(!m)return {source,raw:text,error:"sem valor"};
  const amount=Math.abs(parseNum(amtStr.replace(/\s/g,"")));if(!amount)return {source,raw:text,error:"sem valor"};
  const n=norm(body);

  let merchant="";
  for(const kw of ["em|no estabelecimento|chez|at|auprès de","para|pour|de|à|a|no|na"]){
    const re=new RegExp("(?:^|\\s)(?:"+kw+")\\s+([A-ZÀ-Ý][A-Za-zÀ-ÿ0-9*&'./\\- ]{1,40}?)(?=\\s+(?:em|no|na|le|on|às|a|valor|aprovad|dia|cart|r\\$|€|\\d)|[,;]|\\.(?:\\s|$)|$)");
    const mm=body.match(re);if(mm&&!/^(R\$|US\$|EUR|BRL|USD|CB)$/i.test(mm[1].trim())){merchant=mm[1].trim();break}
  }
  const dm=body.match(/(\d{2})\/(\d{2})(?:\/(\d{2,4}))?/);
  const date=dm?parseDateAny(dm[0]):todayStr();
  const l4=(body.match(/(?:final|terminad[oa] em|se terminant par|ending(?: in)?|\*{2,}|x{3,})\s*(\d{4})/i)||[])[1]||"";
  return {source,raw:text,date:date||todayStr(),amount:income?amount:-amount,currency:cur,desc:merchant||body.slice(0,60),last4:l4,fitid:"ntf:"+hash(text)};
}
function splitNotifications(text){

/* ---------- rules, blocks, matching ---------- */
function ruleMatches(r,row){
  const hay=r.field==="source"?norm(row.source):r.field==="desc"?norm(row.desc):norm(row.desc+" "+row.source+" "+(row.raw||""));
  return r.pattern&&hay.includes(norm(r.pattern));
}
function blockHit(row){
  return cfgBlocks().find(b=>b.type==="source"?norm(row.source)===norm(b.value)||norm(row.source).includes(norm(b.value)):norm(row.desc+" "+(row.raw||"")).includes(norm(b.value)));
}
function accountForRow(row,fallback){
  if(row.forcedAcc)return row.forcedAcc;
  const accs=activeAccounts();
  if(row.last4){const a=accs.find(a=>(a.match||"").includes(row.last4));if(a)return a.id}
  const hay=norm((row.raw||"")+" "+row.source);
  const a=accs.find(a=>a.match&&a.match.split(",").map(norm).filter(Boolean).some(k=>hay.includes(k)));
  if(a)return a.id;
  if(row.currency&&fallback&&getAcc(fallback)?.currency!==row.currency){const b=accs.find(x=>x.currency===row.currency);if(b)return b.id}
  return fallback;
}

function mState(tx){if(tx.status==="pending")return "pending";if(tx.recon==="auto")return "auto";if(tx.recon==="ok"||tx.reconciled)return "rec";if(tx.recon==="imported")return "imported";return "paid"}
function signedIn(tx,accId){
  if(tx.kind==="transfer"){if(tx.accountId===accId)return -tx.amount;if(tx.toAccountId===accId)return tx.amountTo??tx.amount;return null}
  if(tx.accountId!==accId)return null;return tx.kind==="expense"?-tx.amount:tx.amount;
}
function scopeAccounts(row,mf){const s=new Set(mf.accIds);if(mf.rowAcc&&row.accountId)s.add(row.accountId);return [...s].filter(id=>getAcc(id))}
function inWindow(tx,row,mf){if(mf.win==="range")return (!mf.from||tx.date>=mf.from)&&(!mf.to||tx.date<=mf.to);return Math.abs(daysBetween(tx.date,row.date))<=mf.days}
function amountOk(v,row,mf){const d=Math.abs(v-row.amount);if(mf.tol<0)return Math.sign(v)===Math.sign(row.amount);return d<0.005||d<=Math.abs(row.amount)*mf.tol/100}
function candidatesFor(row,opts={}){
  const mf=matchFilters();const accs=opts.anyAccount?activeAccounts().map(a=>a.id):scopeAccounts(row,mf);const out=[];
  const rowCur=getAcc(row.accountId)?.currency;
  for(const tx of allTx()){
    if(tx.importId&&tx.importId===row.fitid)continue;
    if(!opts.anyStatus&&!mf.st[mState(tx)])continue;
    if(!opts.anyDate&&!inWindow(tx,row,mf))continue;
    for(const accId of accs){
      let v=signedIn(tx,accId);if(v==null)continue;
      const cur=getAcc(accId).currency;if(rowCur&&cur!==rowCur)v=r2(convTo(v,cur,rowCur));
      if(!opts.anyAmount&&!amountOk(v,row,mf))continue;
      if(opts.q&&!norm(txSearchText(tx)+" "+(tx.notes||"")).includes(norm(opts.q)))continue;
      const dd=Math.abs(daysBetween(tx.date,row.date)),ad=Math.abs(v-row.amount);
      out.push({id:tx.id,accId,v,dd,ad,score:ad/Math.max(1,Math.abs(row.amount))*100+dd});break;
    }
  }
  return out.sort((a,b)=>a.score-b.score);
}
function analyzeRows(){
  const imp=ui.imp;const mf=matchFilters();
  const known=new Set(allTx().map(x=>x.importId).filter(Boolean));
  const claimed=new Set(imp.rows.filter(r=>r.choiceBy==="user"&&r.choice&&r.choice!=="new").map(r=>r.choice));
  for(const row of imp.rows){
    if(row.error){row.action="error";row.include=false;continue}
    row.accountId=accountForRow(row,imp.accountId);
    if(!row.userCat){row.categoryId="";row.ruleId=null;const r=cfgRules().find(r=>ruleMatches(r,row));
      if(r){row.ruleId=r.id;if(r.ignore){row.action="blocked";row.include=false;row.reason="padrão: ignorar";continue}
        if(r.categoryId)row.categoryId=r.categoryId;if(r.rename)row.descOut=r.rename;if(r.payeeId)row.payeeId=r.payeeId;else if(r.payee)row.payee=r.payee;if(r.accountId&&!row.forcedAcc)row.accountId=r.accountId}}
    row.descOut=row.descOut||row.desc;
    const b=blockHit(row);if(b){row.action="blocked";row.include=false;row.reason=(b.type==="source"?"origem bloqueada: ":"texto bloqueado: ")+b.value;continue}
    row.fitid=row.fitid||("imp:"+hash([row.accountId,row.date,row.amount,row.desc].join("|")));
    if(known.has(row.fitid)){row.action="dup";row.include=false;continue}
    row.cands=candidatesFor(row).filter(c=>!claimed.has(c.id)||c.id===row.choice).slice(0,8);
    if(row.choiceBy!=="user"){
      const best=row.cands.find(c=>!claimed.has(c.id));
      if(mf.auto&&best&&best.ad<0.005){row.choice=best.id;row.choiceBy="auto";claimed.add(best.id)}else{row.choice="new";row.choiceBy="auto"}
    }
    row.action=row.choice&&row.choice!=="new"?"match":"new";
    if(row.action==="match"&&!row.cands.some(c=>c.id===row.choice)){const tx=findTx(row.choice);if(tx){const accId=[tx.accountId,tx.toAccountId].find(id=>signedIn(tx,id)!=null&&id)||tx.accountId;const v=signedIn(tx,accId);row.cands.unshift({id:tx.id,accId,v,dd:Math.abs(daysBetween(tx.date,row.date)),ad:Math.abs(v-row.amount),score:0})}else{row.choice="new";row.action="new"}}
    if(row.adjust===undefined)row.adjust=true;
    if(row.include===undefined)row.include=true;
  }
}
function learnKey(desc){return norm(desc).replace(/\d+[\/.\-]\d+([\/.\-]\d+)?/g,"").replace(/\b(cb|carte|compra|achat|paiement|pagamento|pix|ted|doc|prlv|sepa|vir|virement)\b/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim().split(" ").slice(0,3).join(" ")}

function candLabel(c,row){const tx=findTx(c.id);if(!tx)return "—";const a=getAcc(c.accId);
  return `${fmtDate(tx.date)} · ${tx.description||catName(tx.categoryId)} · ${money(c.v,getAcc(row.accountId)?.currency||a.currency)} · ${a.name} · ${MST_LABEL[mState(tx)]}${c.dd?` · ${c.dd}d`:""}${c.ad>=0.005?` · dif. ${money(c.ad,getAcc(row.accountId)?.currency)}`:""}`}

let XLSX_P=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve();if(XLSX_P)return XLSX_P;XLSX_P=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=()=>{XLSX_P=null;rej(new Error("não foi possível carregar o leitor de Excel"))};document.head.appendChild(s)});return XLSX_P}
async function handleImportFile(f){
  const imp=ui.imp;imp.fileName=f.name;const ext=f.name.split(".").pop().toLowerCase();
  try{
    if(ext==="ofx"||ext==="qfx"){const {rows,currency}=parseOFX(await f.text());if(!rows.length)throw new Error("nenhuma transação encontrada no OFX");rows.forEach(r=>r.currency=currency);imp.rows=rows;imp.table=null;analyzeRows()}
    else if(["xlsx","xls","ods"].includes(ext)){await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];

const ST_LABEL={paid:"Confirmado",sched:"Agendado",late:"Pendente",rec:"Conciliado",auto:"A validar"};
function txState(tx){
  if(tx.recon==="auto")return "auto";
  if(tx.recon==="ok"||tx.reconciled||(tx.recon==="imported"&&tx.importKind==="file"))return "rec";
  if(tx.status==="pending")return tx.date<todayStr()?"late":"sched";
  return "paid";
}
const stPill=s=>`<span class="pill st-${s}">${ST_LABEL[s]||ST_LABEL.paid}</span>`;

/* auto-confirm on load */
let AUTO_RAN=false;
async function autoConfirmDue(){
  if(AUTO_RAN||!state.cfg)return;AUTO_RAN=true;
  const today=todayStr();const keys=[];let n=0;
  for(const tx of allTx())if(tx.status==="pending"&&tx.autoConfirm&&tx.date<=today&&getAcc(tx.accountId)){tx.status="paid";keys.push(monthOf(tx.date));n++}
  if(n){render();await flush(keys);toast(`${n} lançamento(s) confirmado(s) automaticamente na data`)}

/* reversal */
async function reverseTx(tx){
  const a=getAcc(tx.accountId);const today=todayStr();
  const r={...tx,id:uid(),amount:-tx.amount,description:"Estorno "+(tx.description||catName(tx.categoryId)),date:today,status:"paid",recon:null,reversal:true,reversalOf:tx.id,created:new Date().toISOString()};
  ["group","inst","recur","importId","importSnap","importKind","prevStatus","prevRecon","prevImportId","prevAmount","prevAmountTo","reconciled","origin","recognized","autoConfirm"].forEach(k=>delete r[k]);
  if(a&&a.type==="card")r.invoice=invoiceFor(a,today);
  const k=putTx(r);closeModal();render();await flush([k]);toast("Estorno lançado");
}

/* signed value of a tx in an account (for statement/bulk totals) */
function valIn(tx,accId){if(tx.kind==="transfer"){if(tx.accountId===accId)return -tx.amount;if(tx.toAccountId===accId)return tx.amountTo??tx.amount;return 0}if(tx.accountId!==accId)return 0;return tx.kind==="expense"?-tx.amount:tx.amount}
function valMain(tx){const a=getAcc(tx.accountId);if(!a)return 0;if(tx.kind==="transfer")return 0;return conv(tx.kind==="expense"?-tx.amount:tx.amount,a.currency)}

/* statement summary: confirmed vs projected */
function stmtSummary(a,key){
  const start=key+"-01",end=dayDate(key,31);
  const rows={prev:[balance(a,addDay(start,-1),false),balance(a,addDay(start,-1),true)],inc:[0,0],exp:[0,0],tin:[0,0],tout:[0,0]};
  for(const tx of allTx()){if(monthOf(tx.date)!==key)continue;const v=valIn(tx,a.id);if(!v)continue;
    const slot=tx.kind==="transfer"?(v>0?"tin":"tout"):(v>0?"inc":"exp");
    rows[slot][1]+=Math.abs(v);if(tx.status!=="pending")rows[slot][0]+=Math.abs(v)}
  const res=[0,1].map(i=>r2(rows.inc[i]+rows.tin[i]-rows.exp[i]-rows.tout[i]));
  const fin=[0,1].map(i=>r2(rows.prev[i]+res[i]));
  const line=(l,arr,cls="",sign=1)=>`<tr${cls?` class="${cls}"`:""}><td>${l}</td>${arr.map(v=>`<td class="r num ${sign*v<0?"neg":""}">${money(sign*v,a.currency)}</td>`).join("")}</tr>`;
  return `<div class="tablewrap" style="max-width:560px"><table><thead><tr><th>Resumo de ${monthShort(key)}</th><th class="r">Confirmada</th><th class="r">Projetada</th></tr></thead><tbody>
   ${line(t("prevBalance"),rows.prev)}${line(t("income"),rows.inc)}${line(t("expense"),rows.exp,"",-1)}${line("Transferências de entrada",rows.tin)}${line("Transferências de saída",rows.tout,"",-1)}
   ${line(t("result"),res)}${line("Saldo final",fin,"total")}</tbody></table></div>`;
}

    if(op==="pend"&&tx.status!=="pending"&&getAcc(tx.accountId)?.type!=="card"){tx.status="pending";if(tx.recon==="ok"||tx.recon==="auto")tx.recon=null;keys.push(monthOf(tx.date))}

    if(op==="unrec"&&(tx.recon==="ok"||tx.recon==="auto"||tx.reconciled)){tx.recon=null;delete tx.reconciled;keys.push(monthOf(tx.date))}
  }
  ui.sel.clear();render();await flush(keys);toast(`${keys.length} lançamento(s) atualizado(s)`);
}

function cardSummary(c,key,d){

/* savings goals */
const goals=()=>state.cfg.goals||(state.cfg.goals=[]);
function goalFirstMonth(g,day){const today=todayStr();const base=(g.start||today)>today?g.start:today;let m=monthOf(base);if(dayDate(m,day)<base)m=addMonths(m,1);return m}
function goalStats(g){
  const ids=new Set((g.accounts||[]).map(x=>x.id));
  let saved=(g.accounts||[]).reduce((s,x)=>s+(x.initial||0),0),sched=0;
  for(const tx of allTx()){if(tx.goalId!==g.id)continue;let v=0;
    if(tx.kind==="transfer"){if(ids.has(tx.toAccountId))v+=tx.amountTo??tx.amount;if(ids.has(tx.accountId))v-=tx.amount}
    else if(ids.has(tx.accountId))v=tx.kind==="income"?tx.amount:-tx.amount;
    if(tx.status==="pending")sched+=v;else saved+=v}
  saved=r2(saved);const left=r2(Math.max(0,g.target-saved));
  const n=Math.max(1,monthsDiff(goalFirstMonth(g,5),g.deadline)+1);const i=(g.rate||0)/100;
  let pmt=i>0?(g.target-saved*Math.pow(1+i,n))*i/(Math.pow(1+i,n)-1):(g.target-saved)/n;pmt=r2(Math.max(0,pmt));
  return {saved,sched:r2(sched),left,n,pmt,pct:g.target?Math.min(100,saved/g.target*100):0};
}

  return `<section class="panel"><h2>Campos do lançamento</h2><div class="list">
   ${ck("party","Cliente / fornecedor","Selecionar um cadastro de cliente ou fornecedor em cada lançamento")}
   ${ck("costCenter","Centro de custo","Classificar lançamentos por centro de custo (Casa, Trabalho…)")}
   ${ck("tags","Tags","Marcar lançamentos com palavras livres, como viagem ou reforma")}</div>
   <p class="muted" style="font-size:13px">Desligar um campo só o esconde do formulário; valores já gravados são mantidos.</p>
   <div class="tools"><button class="btn primary" data-act="saveParams">${t("save")}</button></div></section>`;
}
function partiesTab(){
  const L=parties().slice().sort((a,b)=>a.name.localeCompare(b.name));
  const used=id=>allTx().filter(x=>x.payeeId===id).length;
  return `<section class="panel"><h2>Clientes e fornecedores<button class="btn small primary" data-act="newParty">+ Cadastro</button></h2>
   ${L.length?`<div class="list">${L.map(p=>`<div class="row"><div class="main"><b>${esc(p.name)}</b> <span class="pill">${PARTY_TYPES[p.type]}</span><div class="muted" style="font-size:13px">${[p.doc,p.contact,p.categoryId?"→ "+esc(catName(p.categoryId)):"",used(p.id)+" lançamento(s)"].filter(Boolean).map(esc).join(" · ")}</div></div><button class="btn small" data-act="editParty" data-id="${p.id}">${t("edit")}</button></div>`).join("")}</div>`:`<p class="muted">Nenhum cadastro ainda. Crie aqui ou direto no formulário do lançamento.</p>`}</section>
   <section class="panel"><h2>Centros de custo</h2><div class="field"><label for="ls-cc">Um por linha</label><textarea id="ls-cc" rows="6">${esc(state.cfg.costCenters.join("\n"))}</textarea></div><div class="tools" style="margin-top:8px"><button class="btn primary" data-act="saveLists">${t("save")}</button></div></section>`;
}
const UNIT_LABEL={d:["dia","dias"],w:["semana","semanas"],m:["mês","meses"],y:["ano","anos"]};
function occDate(base,unit,k){if(unit==="d")return addDay(base,k);if(unit==="w")return addDay(base,7*k);if(unit==="y")return addMonthsDate(base,12*k);return addMonthsDate(base,k)}
function occurrences(base,rp){const out=[];for(let i=0;i<400;i++){const d=occDate(base,rp.unit,i*Math.max(1,rp.every));if(rp.end==="date"){if(!rp.until||d>rp.until)break}else if(i>=Math.max(1,rp.count))break;out.push(d)}return out.length?out:[base]}
const monthsDiff=(a,b)=>{const [ya,ma]=a.split("-").map(Number),[yb,mb]=b.split("-").map(Number);return (yb-ya)*12+(mb-ma)};
function stValue(tx){if(tx.status==="pending")return "pending";const s=txState(tx);return s==="rec"||s==="auto"?"rec":"paid"}
function applyStatus(tx,sv){
  if(sv==="pending"){tx.status="pending";if(tx.recon==="ok"||tx.recon==="auto")tx.recon=null}
  else if(sv==="rec"){tx.status="paid";tx.recon="ok"}
  else{tx.status="paid";if(tx.recon==="ok"||tx.recon==="auto")tx.recon=null}
  delete tx.reconciled;
}
function txModal(tx,opts={}){
  const isNew=!tx;
  if(!activeAccounts().length){toast("Cadastre uma conta primeiro.");ui.view="cadastros";ui.setTab="accounts";render();return}
  const defAcc=opts.acc||(ui.view==="cartoes"?ui.card:ui.acct)||activeAccounts()[0].id;
  tx=tx?{...tx}:opts.prefill?{...opts.prefill}:{id:uid(),kind:opts.kind||"expense",accountId:defAcc,date:todayStr(),amount:0,status:opts.pending?"pending":"paid",description:"",categoryId:"",payee:"",costCenter:"",tags:"",notes:""};
  if(tx.splits)tx.splits=tx.splits.map(x=>({...x}));
  const st={kind:tx.kind,split:hasSplits(tx)};let sv=stValue(tx);
  const prevSplit=()=>{const n=norm(tx.description);return allTx().filter(x=>x.id!==tx.id&&hasSplits(x)&&x.kind===st.kind&&((tx.payeeId&&x.payeeId===tx.payeeId)||(n&&norm(x.description)===n))).sort((a,b)=>((a.date<=tx.date)-(b.date<=tx.date))||(a.date<b.date?1:-1)).sort((a,b)=>(b.date<=tx.date)-(a.date<=tx.date))[0]};
  const splitBox=(isCard)=>{const pv=prevSplit();const catFor=x=>catOptions(x.type==="income"&&!isCard?"income":"expense",x.categoryId);
    return `<div class="field full" id="sp-box"><label>Detalhamento <span class="muted" style="font-weight:400">· cada linha vai para a sua categoria; a conta recebe só o líquido</span></label>
     ${tx.splits.map((x,i)=>`<div class="sp-row"><select data-sp="type" data-i="${i}" aria-label="Entrada ou saída"><option value="income" ${x.type==="income"?"selected":""}>+ Entrada</option><option value="expense" ${x.type!=="income"?"selected":""}>− Saída</option></select>
      <select data-sp="cat" data-i="${i}" aria-label="${t("category")}">${catFor(x)}</select><input data-sp="amt" data-i="${i}" inputmode="decimal" value="${x.amount?(+x.amount).toFixed(2):""}" placeholder="0,00" aria-label="${t("value")}"><button type="button" class="btn small" data-spdel="${i}" aria-label="Remover linha">×</button>
      <input class="sp-desc" data-sp="desc" data-i="${i}" value="${esc(x.description||"")}" placeholder="Descrição da linha (ex.: ${i===0?"Salário bruto":"Cotisations sociales"})"></div>`).join("")}
     <div class="tools"><button type="button" class="btn small" id="sp-add">+ Linha</button>${pv&&!tx.splits.some(x=>x.amount)?`<button type="button" class="btn small" id="sp-copy">Copiar detalhamento de ${fmtDate(pv.date)}</button>`:""}<button type="button" class="btn small" id="sp-off">Desfazer detalhamento</button></div>
     <div class="hint" id="sp-sum" style="margin-top:6px"></div></div>`};
  const rp={mode:"none",every:1,unit:"m",end:"count",count:12,until:"",basis:"total"};
  const html=()=>{
    const a=getAcc(tx.accountId)||activeAccounts()[0];const isCard=a.type==="card";const F=fieldsOn();
    const to=tx.toAccountId?getAcc(tx.toAccountId):null;const differ=st.kind==="transfer"&&to&&to.currency!==a.currency;
    if(differ&&tx.amountTo==null&&tx.amount)tx.amountTo=r2(convTo(tx.amount,a.currency,to.currency));
    const invKey=tx.invoice||(isCard?(opts.inv||invoiceFor(a,tx.date)):null);
    const invOpts=isCard?[-2,-1,0,1,2,3].map(n=>addMonths(invoiceFor(a,tx.date),n)):[];
    const statusOpts=(isCard&&st.kind!=="transfer"?[["paid","Confirmado"],["rec","Conciliado"]]:[["pending","Previsto (a pagar/receber)"],["paid","Confirmado"],["rec","Conciliado"]]);
    if(!statusOpts.some(o=>o[0]===sv))sv="paid";
    return `<h3>${isNew?(opts.prefill?"Clonar lançamento":t("newTx")):t("editTx")}</h3>
    ${seg("txkind",[["expense",t("expenseShort")],["income",isCard?t("refund"):t("incomeShort")],["transfer",t("transfer")]],st.kind)}
    <div class="form">
     ${st.kind==="transfer"?`
      <div class="field"><label for="tx-acc">${t("from")}</label><select id="tx-acc">${accOptions(tx.accountId,x=>x.type!=="card")}</select></div>
      <div class="field"><label for="tx-to">${t("to")}</label><select id="tx-to"><option value="">—</option>${accOptions(tx.toAccountId||"",x=>x.id!==tx.accountId)}</select><span class="hint">Para pagar fatura escolha o cartão de destino.</span></div>`:
      `<div class="field full"><label for="tx-acc">${t("account")} / ${t("card")}</label><select id="tx-acc">${accOptions(tx.accountId)}</select></div>`}
     <div class="field"><label for="tx-date">${isCard&&st.kind!=="transfer"?"Data da compra":rp.mode!=="none"?"Primeira ocorrência":t("date")}</label><input type="date" id="tx-date" value="${tx.date}"></div>
     <div class="field"><label for="tx-amt">${differ?"Valor de origem":st.split?"Valor líquido na conta":t("value")} (${a.currency})</label><input id="tx-amt" inputmode="decimal" value="${tx.amount?tx.amount.toFixed(2):""}" placeholder="0,00"></div>
     ${differ?`<div class="field"><label for="tx-amtto">Valor de destino (${to.currency})</label><input id="tx-amtto" inputmode="decimal" value="${tx.amountTo!=null?tx.amountTo.toFixed(2):""}" placeholder="0,00"></div>
       <div class="field"><span class="hint" id="tx-rate"></span><button class="btn small" id="tx-fx" type="button" style="align-self:flex-start">Usar câmbio do dia</button></div>`:""}
     ${st.kind==="transfer"&&to&&to.type==="card"?`<div class="field"><label for="tx-inv">${t("invoice")}</label><select id="tx-inv">${[-2,-1,0,1].map(n=>{const k=addMonths(invoiceFor(to,tx.date),n);return `<option value="${k}" ${tx.invoice===k?"selected":""}>${monthLabel(k)}</option>`}).join("")}</select></div>`:""}
     ${isCard&&st.kind!=="transfer"?`<div class="field"><label for="tx-inv">${t("invoice")}</label><select id="tx-inv">${invOpts.map(k=>`<option value="${k}" ${invKey===k?"selected":""}>${monthLabel(k)} · vence ${fmtDate(dueDate(a,k))}</option>`).join("")}</select></div>`:""}
     <div class="field full"><label for="tx-desc">${t("description")}</label><input id="tx-desc" value="${esc(tx.description)}" list="dl-desc"></div>
     ${st.kind!=="transfer"?`${st.split?splitBox(isCard):`<div class="field"><label for="tx-cat">${t("category")}</label><select id="tx-cat">${catOptions(st.kind==="income"&&!isCard?"income":"expense",tx.categoryId,a.id)}</select><button type="button" class="linkbtn" id="tx-split">Detalhar em várias linhas</button></div>`}
     ${F.party?`<div class="field"><label for="tx-party">${partyLabel(st.kind)}</label>${st.newParty?`<div style="display:flex;gap:6px"><input id="tx-pname" placeholder="Nome do novo cadastro" style="flex:1"><button class="btn small primary" type="button" id="tx-padd">Criar</button><button class="btn small" type="button" id="tx-pcancel">×</button></div>`:`<div style="display:flex;gap:6px"><select id="tx-party" style="flex:1"><option value="">—</option>${partyOptions(st.kind,tx.payeeId)}</select><button class="btn small" type="button" id="tx-pnew" title="Novo cadastro">+ Novo</button></div>`}${!tx.payeeId&&tx.payee?`<span class="hint">Texto antigo: ${esc(tx.payee)}</span>`:""}</div>`:""}
     ${F.costCenter?`<div class="field"><label for="tx-cc">${t("costCenter")}</label><select id="tx-cc"><option value="">—</option>${state.cfg.costCenters.map(c=>`<option ${tx.costCenter===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`:""}
     ${F.tags?`<div class="field"><label for="tx-tags">${t("tags")}</label><input id="tx-tags" value="${esc(tx.tags)}" placeholder="viagem, férias"></div>`:""}`:""}
     <div class="field"><label for="tx-status">${t("status")}</label><select id="tx-status">${statusOpts.map(([v,l])=>`<option value="${v}" ${sv===v?"selected":""}>${l}</option>`).join("")}</select>${tx.recon==="auto"?'<span class="hint">Conciliação automática aguardando validação.</span>':""}</div>
     ${!(isCard&&st.kind!=="transfer")?`<div class="field"><label style="display:flex;gap:8px;align-items:center;color:var(--fg);margin-top:22px"><input type="checkbox" id="tx-auto" ${tx.autoConfirm?"checked":""} style="width:auto"> Confirmar automaticamente na data</label><span class="hint">Para débitos automáticos; vale quando o lançamento está previsto.</span></div>`:""}
     ${isCard&&st.kind!=="transfer"&&(a.holders||[]).length>1?`<div class="field"><label for="tx-holder">Titular</label><select id="tx-holder">${a.holders.map(h=>`<option ${(tx.holder||a.holders[0])===h?"selected":""}>${esc(h)}</option>`).join("")}</select></div>`:""}
     ${st.kind==="transfer"&&(state.cfg.goals||[]).some(g=>!g.archived)?`<div class="field"><label for="tx-goal">Meta de economia</label><select id="tx-goal"><option value="">—</option>${state.cfg.goals.filter(g=>!g.archived).map(g=>`<option value="${g.id}" ${tx.goalId===g.id?"selected":""}>${esc(g.name)}</option>`).join("")}</select></div>`:""}
     ${isNew?`<div class="field full" style="border-top:1px solid var(--line);padding-top:12px"><label>${t("repeat")}</label>
       ${seg("rpmode",[["none","Não repete"],["fixed","Fixo"],...(st.kind!=="transfer"&&!st.split?[["inst","Parcelado"]]:[])],rp.mode)}</div>
       ${rp.mode!=="none"?`<div class="field"><label for="rp-every">A cada</label><div style="display:flex;gap:8px"><input id="rp-every" type="number" min="1" max="99" value="${rp.every}" style="width:80px"><select id="rp-unit" style="flex:1">${["d","w","m","y"].map(u=>`<option value="${u}" ${rp.unit===u?"selected":""}>${UNIT_LABEL[u][1]}</option>`).join("")}</select></div></div>
       <div class="field"><label for="rp-end">Término</label><div style="display:flex;gap:8px"><select id="rp-end" style="flex:1"><option value="count" ${rp.end==="count"?"selected":""}>${rp.mode==="inst"?"Nº de parcelas":"Nº de vezes"}</option><option value="date" ${rp.end==="date"?"selected":""}>Data final</option></select>
        ${rp.end==="count"?`<input id="rp-count" type="number" min="1" max="400" value="${rp.count}" style="width:90px" aria-label="Quantidade">`:`<input id="rp-until" type="date" value="${rp.until||addMonthsDate(tx.date,11)}" aria-label="Data final">`}</div></div>
       ${rp.mode==="inst"?`<div class="field full"><label>O valor informado é</label>${seg("rpbasis",[["total","Total da compra"],["each","Valor de cada parcela"]],rp.basis)}</div>`:""}
       <div class="field full"><span class="hint" id="rp-prev"></span></div>`:""}`:""}
     <div class="field full"><label for="tx-notes">${t("notes")}</label><textarea id="tx-notes" rows="2">${esc(tx.notes)}</textarea></div>
     ${!isNew&&(tx.group)?`<div class="field full"><label for="tx-scope">Aplicar a</label><select id="tx-scope"><option value="one">${t("onlyThis")}</option><option value="next">${t("thisAndNext")}</option></select></div>`:""}
    </div>
    <datalist id="dl-desc">${[...new Set(allTx().map(x=>x.description).filter(Boolean))].slice(-80).map(d=>`<option value="${esc(d)}">`).join("")}</datalist>
    <div class="actions">${!isNew?`<button class="btn danger" id="tx-del">${t("del")}</button><button class="btn" id="tx-clone">Clonar</button>${tx.status!=="pending"&&tx.kind!=="transfer"&&!tx.reversal?'<button class="btn" id="tx-rev">Estornar</button>':""}${tx.recur&&tx.status==="pending"?'<button class="btn" id="tx-recog" title="Confere valor e data reais desta ocorrência">Reconhecer</button>':""}<span class="spacer"></span>`:""}<button class="btn" data-act="closeModal">${t("cancel")}</button><button class="btn primary" id="tx-save">${t("save")}</button></div>`;
  };
  const readInto=()=>{
    const g=id=>{const el=document.getElementById(id);return el?el.value:undefined};
    tx.accountId=g("tx-acc")||tx.accountId;tx.date=g("tx-date")||tx.date;tx.amount=r2(Math.abs(parseNum(g("tx-amt"))));if(tx.reversal)tx.amount=-tx.amount;{const ac=document.getElementById("tx-auto");if(ac)tx.autoConfirm=ac.checked;const ho=document.getElementById("tx-holder");if(ho)tx.holder=ho.value;const go=document.getElementById("tx-goal");if(go)tx.goalId=go.value||undefined}
    tx.description=(g("tx-desc")||"").trim();tx.notes=g("tx-notes")||"";
    if(g("tx-cat")!==undefined)tx.categoryId=g("tx-cat");if(g("tx-party")!==undefined){tx.payeeId=g("tx-party")||undefined;if(tx.payeeId)tx.payee=getParty(tx.payeeId)?.name||""}
    if(g("tx-cc")!==undefined)tx.costCenter=g("tx-cc");if(g("tx-tags")!==undefined)tx.tags=g("tx-tags");
    if(g("tx-to")!==undefined)tx.toAccountId=g("tx-to")||undefined;
    const at=g("tx-amtto");if(at!==undefined)tx.amountTo=at.trim()?r2(parseNum(at)):undefined;else tx.amountTo=undefined;
    const inv=g("tx-inv");if(inv!==undefined)tx.invoice=inv||undefined;
    if(g("tx-status")!==undefined)sv=g("tx-status");
    if(g("rp-every")!==undefined)rp.every=Math.max(1,parseInt(g("rp-every"),10)||1);
    if(g("rp-unit")!==undefined)rp.unit=g("rp-unit");if(g("rp-end")!==undefined)rp.end=g("rp-end");
    if(g("rp-count")!==undefined)rp.count=Math.max(1,Math.min(400,parseInt(g("rp-count"),10)||1));
    if(g("rp-until")!==undefined)rp.until=g("rp-until");
    if(st.split&&tx.splits){document.querySelectorAll("#modal-root [data-sp]").forEach(el=>{const x=tx.splits[+el.dataset.i];if(!x)return;const k=el.dataset.sp;
      if(k==="type")x.type=el.value;else if(k==="cat")x.categoryId=el.value;else if(k==="desc")x.description=el.value.trim();else if(k==="amt")x.amount=r2(Math.abs(parseNum(el.value)))})}
    if(!st.split||st.kind==="transfer")delete tx.splits;
  };
  const mount=m=>{
    const dlg=m.querySelector(".modal");
    const redraw=()=>{dlg.innerHTML=html();wire()};
    dlg.addEventListener("click",e=>{
      const b=e.target.closest('[data-name="txkind"]');
      if(b){readInto();st.kind=b.dataset.val;tx.kind=st.kind;if(st.kind==="transfer")st.split=false;if(st.kind==="transfer"){if(getAcc(tx.accountId)?.type==="card"){const nc=activeAccounts().find(x=>x.type!=="card");if(nc){tx.toAccountId=tx.accountId;tx.accountId=nc.id}}if(rp.mode==="inst")rp.mode="fixed"}tx.categoryId="";redraw();return}
      const r=e.target.closest('[data-name="rpmode"]');if(r){readInto();rp.mode=r.dataset.val;if(rp.mode==="inst"&&rp.count===12)rp.count=3;redraw()}
      const bs=e.target.closest('[data-name="rpbasis"]');if(bs){readInto();rp.basis=bs.dataset.val;redraw()}
      const sd=e.target.closest("[data-spdel]");if(sd){readInto();tx.splits.splice(+sd.dataset.spdel,1);if(!tx.splits.length){st.split=false;delete tx.splits}redraw()}
    });
    const wire=()=>{
      const q=id=>dlg.querySelector("#"+id);
      const rerender=()=>{readInto();const a=getAcc(tx.accountId);if(a&&a.type==="card"&&st.kind!=="transfer")tx.invoice=invoiceFor(a,tx.date);else if(st.kind!=="transfer")tx.invoice=undefined;if(st.kind==="transfer"){const tt=getAcc(tx.toAccountId);if(tt&&tt.id===tx.accountId)tx.toAccountId=undefined}redraw()};
      q("tx-acc")?.addEventListener("change",rerender);q("tx-date")?.addEventListener("change",rerender);
      q("tx-to")?.addEventListener("change",()=>{readInto();const tt=getAcc(tx.toAccountId);tx.invoice=tt&&tt.type==="card"?invoiceFor(tt,tx.date):undefined;tx.amountTo=undefined;redraw()});
      ["rp-unit","rp-end"].forEach(id=>q(id)?.addEventListener("change",()=>{readInto();redraw()}));
      const prev=()=>{const el=q("rp-prev");if(!el)return;readInto();const ds=occurrences(tx.date,rp);const each=rp.mode==="inst"&&rp.basis==="each";const per=rp.mode==="inst"&&!each?r2(tx.amount/ds.length):tx.amount;const total=each?r2(tx.amount*ds.length):tx.amount;const cur=getAcc(tx.accountId)?.currency;
        el.innerHTML=`<b>${ds.length} ${rp.mode==="inst"?"parcelas":"lançamentos"}</b> de ${money(per,cur)} · ${fmtDate(ds[0])} → ${fmtDate(ds[ds.length-1])}${ds.length>=400?" (limite de 400)":""}${rp.mode==="inst"?` · total ${money(total,cur)}`:""}`};
      ["rp-every","rp-count","rp-until","tx-amt"].forEach(id=>q(id)?.addEventListener("input",prev));prev();
      const rateEl=q("tx-rate");
      const rate=()=>{if(!rateEl)return;const a=getAcc(tx.accountId),tt=getAcc(tx.toAccountId);const o=parseNum(q("tx-amt").value),d=parseNum(q("tx-amtto").value);const day=convTo(1,a.currency,tt.currency);
        rateEl.innerHTML=`${o&&d?`Câmbio da operação: 1 ${a.currency} = ${(d/o).toLocaleString(LOCALE[LANG],{maximumFractionDigits:4})} ${tt.currency}<br>`:""}Câmbio do dia: ${day?day.toLocaleString(LOCALE[LANG],{maximumFractionDigits:4}):"—"} ${tt.currency}`};
      if(rateEl){q("tx-amt").addEventListener("input",rate);q("tx-amtto").addEventListener("input",rate);rate();
        q("tx-fx").onclick=()=>{const a=getAcc(tx.accountId),tt=getAcc(tx.toAccountId);const o=parseNum(q("tx-amt").value);if(o){q("tx-amtto").value=r2(convTo(o,a.currency,tt.currency)).toFixed(2);rate()}}}
      q("tx-pnew")?.addEventListener("click",()=>{readInto();st.newParty=true;redraw();setTimeout(()=>q("tx-pname")?.focus(),10)});
      q("tx-pcancel")?.addEventListener("click",()=>{st.newParty=false;redraw()});
      q("tx-padd")?.addEventListener("click",async()=>{const n=q("tx-pname").value.trim();if(!n){toast("Informe o nome.");return}readInto();const p={id:uid(),name:n,type:st.kind==="income"?"client":"supplier",doc:"",contact:"",categoryId:"",notes:""};parties().push(p);tx.payeeId=p.id;tx.payee="";st.newParty=false;redraw();await saveCfg();toast("Cadastro criado")});
      q("tx-party")?.addEventListener("change",()=>{readInto();const p=getParty(tx.payeeId);if(p&&p.categoryId&&!tx.categoryId){tx.categoryId=p.categoryId;redraw()}});
      q("tx-split")?.addEventListener("click",()=>{readInto();st.split=true;if(rp.mode==="inst")rp.mode="none";const isInc=st.kind==="income";
        tx.splits=[{id:uid(),type:st.kind,categoryId:tx.categoryId||"",description:"",amount:tx.amount||0},{id:uid(),type:"expense",categoryId:"",description:"",amount:0}];if(!isInc)tx.splits[1].type="expense";redraw()});
      q("sp-off")?.addEventListener("click",()=>{readInto();const big=(tx.splits||[]).filter(x=>x.type===st.kind).sort((a,b)=>b.amount-a.amount)[0];if(big&&big.categoryId)tx.categoryId=big.categoryId;st.split=false;delete tx.splits;redraw()});
      q("sp-add")?.addEventListener("click",()=>{readInto();tx.splits.push({id:uid(),type:"expense",categoryId:"",description:"",amount:0});redraw();setTimeout(()=>dlg.querySelector(`[data-sp="amt"][data-i="${tx.splits.length-1}"]`)?.focus(),10)});
      q("sp-copy")?.addEventListener("click",()=>{readInto();const pv=prevSplit();if(!pv)return;tx.splits=pv.splits.map(x=>({...x,id:uid()}));if(!tx.amount)tx.amount=Math.abs(splitNet(tx.splits));if(!tx.categoryId)tx.categoryId=pv.categoryId;redraw()});
      dlg.querySelectorAll('[data-sp="type"]').forEach(el=>el.addEventListener("change",()=>{readInto();redraw()}));
      const spSum=()=>{const el=q("sp-sum");if(!el)return;readInto();const cur=getAcc(tx.accountId)?.currency;const L=tx.splits||[];
        const inn=r2(L.filter(x=>x.type==="income").reduce((s,x)=>s+(x.amount||0),0)),out=r2(L.filter(x=>x.type!=="income").reduce((s,x)=>s+(x.amount||0),0));const net=r2(inn-out);
        const want=(st.kind==="income"?1:-1)*Math.abs(tx.amount||0);const diff=r2(want-net);
        el.innerHTML=`Entradas ${money(inn,cur)} − saídas ${money(out,cur)} = <b>líquido ${money(net,cur)}</b>`+(Math.abs(diff)>=0.005&&L.some(x=>x.amount)?`<br><span class="neg">Diferença de ${money(Math.abs(diff),cur)} para o valor líquido.</span> <button type="button" class="linkbtn" id="sp-fit">Usar ${money(Math.abs(net),cur)} como valor</button> · <button type="button" class="linkbtn" id="sp-rest">Criar linha com a diferença</button>`:Math.abs(diff)<0.005&&L.some(x=>x.amount)?` <span class="pos">✓ confere</span>`:"");

        q("sp-rest")?.addEventListener("click",()=>{readInto();tx.splits.push({id:uid(),type:diff>0?"income":"expense",categoryId:"",description:"",amount:Math.abs(diff)});redraw()})};
      dlg.querySelectorAll('[data-sp="amt"]').forEach(el=>el.addEventListener("input",spSum));q("tx-amt")?.addEventListener("input",spSum);spSum();
      q("tx-save").onclick=()=>saveTx(tx,isNew,readInto,rp,()=>sv);

    };

  if(isNew&&!opts.inv&&!opts.prefill){const a=getAcc(tx.accountId);if(a&&a.type==="card")tx.invoice=invoiceFor(a,tx.date)}

  openModal(html(),mount);
