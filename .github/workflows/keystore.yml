name: Criar chave Android (rodar uma vez)

# Gera a chave de upload do app Android numa máquina do GitHub,
# sem precisar de Java no seu computador.
# Antes, crie o secret ANDROID_KEYSTORE_PASSWORD com uma senha forte (mín. 6 caracteres).

on:
  workflow_dispatch:

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gerar chave de upload
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_EXISTING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -e
          if [ -n "$KS_EXISTING" ]; then
            echo "::error::Já existe o secret ANDROID_KEYSTORE_BASE64. Uma chave nova invalidaria as atualizações do app. Se quer mesmo trocar, apague esse secret antes."
            exit 1
          fi
          if [ -z "$KS_PASS" ]; then echo "::error::Crie primeiro o secret ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          if [ ${#KS_PASS} -lt 6 ]; then echo "::error::A senha precisa ter pelo menos 6 caracteres"; exit 1; fi
          mkdir -p out
          keytool -genkeypair -keystore out/upload.jks -storetype PKCS12 -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Mashuca Wallet, O=$OWNER, C=FR"
          base64 -w0 out/upload.jks > out/ANDROID_KEYSTORE_BASE64.txt
          keytool -list -v -keystore out/upload.jks -alias upload -storepass "$KS_PASS" \
            | grep -E '^\s*SHA(1|256):' | sed 's/^\s*//' > out/impressoes-digitais.txt
          cat out/impressoes-digitais.txt
          {
            echo "## Chave criada"
            echo "Copie para o Firebase (app Android > Adicionar impressão digital):"
            echo '```'
            cat out/impressoes-digitais.txt
            echo '```'
            echo "Baixe o artefato **chave-android-GUARDAR** abaixo (fica disponível só 1 dia), guarde o upload.jks e crie o secret ANDROID_KEYSTORE_BASE64 com o conteúdo de ANDROID_KEYSTORE_BASE64.txt."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chave-android-GUARDAR
          path: out/
          retention-days: 1
