name: Gerar app Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versão exibida na Play Store (ex.: 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
      FX_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/fx.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar conteúdo do app
        run: |
          node scripts/build.mjs
          node scripts/update-fx.mjs

      - name: Criar projeto Android
        run: npx cap add android

      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::Crie o secret GOOGLE_SERVICES_JSON (veja o README)"; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Ajustar projeto (login Google, versão)
        run: node scripts/android-setup.mjs

      - name: Ícones e tela de abertura
        run: npx @capacitor/assets generate --android || echo "Usando ícones padrão"

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar AAB (Play Store) e APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Assinar AAB e APK com a chave de upload
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Crie os secrets da chave de upload (veja o README)"; exit 1; fi
          if [ -z "$KS_PASS" ]; then echo "::error::Crie o secret ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          if ! printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > upload.jks 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 não é um texto base64 válido. Copie de novo TODO o conteúdo de ANDROID_KEYSTORE_BASE64.txt (uma linha longa, ~3.600 caracteres)."; exit 1; fi
          echo "Chave decodificada: $(wc -c < upload.jks) bytes (o normal é ~2.700)"
          if ! keytool -list -keystore upload.jks -storepass "$KS_PASS" >/dev/null 2>&1; then
            if [ "$(wc -c < upload.jks)" -lt 2000 ]; then
              echo "::error::O conteúdo de ANDROID_KEYSTORE_BASE64 parece incompleto ($(wc -c < upload.jks) bytes). Copie de novo todo o ANDROID_KEYSTORE_BASE64.txt."
            else
              echo "::error::A senha em ANDROID_KEYSTORE_PASSWORD não abre a chave. Use exatamente a senha que estava nesse secret quando você rodou 'Criar chave Android' (ou gere uma chave nova: veja o README)."
            fi
            exit 1
          fi
          ALIAS="${KEY_ALIAS:-upload}"
          if ! keytool -list -keystore upload.jks -storepass "$KS_PASS" -alias "$ALIAS" >/dev/null 2>&1; then
            FOUND=$(keytool -list -keystore upload.jks -storepass "$KS_PASS" 2>/dev/null | awk -F, '/PrivateKeyEntry/{print $1; exit}')
            echo "::warning::O alias '$ALIAS' (ANDROID_KEY_ALIAS) não existe na chave; usando '$FOUND'."
            ALIAS="$FOUND"
          fi
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          KP="${KEY_PASS:-$KS_PASS}"
          if ! jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KS_PASS" -keypass "$KP" "$AAB" "$ALIAS" >/dev/null 2>&1; then
            echo "::warning::ANDROID_KEY_PASSWORD não confere; usando a senha do keystore (chaves PKCS12 usam uma só senha)."
            KP="$KS_PASS"
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KS_PASS" -keypass "$KP" "$AAB" "$ALIAS"
          fi
          jarsigner -verify "$AAB"
          mkdir -p dist
          cp "$AAB" "dist/mashuca-wallet-${VERSION_NAME}-${VERSION_CODE}.aab"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks upload.jks --ks-pass pass:"$KS_PASS" --ks-key-alias "$ALIAS" --key-pass pass:"$KP" --out "dist/mashuca-wallet-${VERSION_NAME}-teste.apk" aligned.apk
          "$BT/apksigner" verify "dist/mashuca-wallet-${VERSION_NAME}-teste.apk"
          rm aligned.apk
          rm upload.jks

      - uses: actions/upload-artifact@v4
        with:
          name: mashuca-wallet-android-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: dist/
